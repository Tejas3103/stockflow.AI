name: Python Backend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r "Multi-Agent Stock Analysis recommendation/requirements.txt"
    - name: Set Tavily API Key
      run: echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> $GITHUB_ENV
    - name: Set OpenAI API Key
      run: echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
    - name: Test with pytest
      env:
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        cd backend # Navigate to the backend directory
        pytest test_api.py # Run the test file

  notify-on-failure:
    needs: build  # This job depends on the 'build' job
    if: failure() # This job will only run if the 'build' job fails
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} # Use the secret you set up
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "text": ":x: *CI/CD Failed* in `${{ github.repository }}`\nBranch: `${{ github.ref }}`\nCommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\nWorkflow: *${{ github.workflow }}* - Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
          }' $SLACK_WEBHOOK_URL