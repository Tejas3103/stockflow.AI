name: Python Backend Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Test with pytest
      # You will need to create some pytest tests in your backend directory
      # For now, this will simply pass if pytest is installed and no tests are found.
      # If you have existing tests, they will run here.
      run: |
        pip install pytest
        pytest backend/  # Assuming your tests are in the backend directory
    - name: Display success message
      run: echo "Python Backend Tests completed successfully!" 